name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ma_ci
          POSTGRES_PASSWORD: ma_ci_password
          POSTGRES_DB: medical_alliance_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ma_ci:ma_ci_password@localhost:5432/medical_alliance_dev?schema=public
      TEST_DATABASE_URL: postgresql://ma_ci:ma_ci_password@localhost:5432/medical_alliance_test?schema=public
      # CI-only value. Real environments read this from their secret store.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      # Document storage for the Phase 2 suites. The API tests swap in an
      # in-memory adapter, but the local one still needs a writable path.
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/ma-ci-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create the test database
        run: |
          PGPASSWORD=ma_ci_password createdb -h localhost -U ma_ci medical_alliance_test

      - name: Generate the Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed and verify the database
        run: |
          npm run db:seed
          npm run db:verify

      - name: API tests (unit, integration, tenant isolation)
        run: npm run test:api

      - name: Web tests
        run: npm run test:web

      - name: Audit dependencies
        run: npm audit --audit-level=high
