<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script><style>body{margin:0;padding:20px;background:var(--surface-page);font:var(--type-body)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { TextField, SelectField, Checkbox, Radio, Switch, Icon } = window.MedicalAllianceDesignSystem_32f8e4;
const App = () => {
  const [outcome, setOutcome] = React.useState('restricted');
  const [alerts, setAlerts] = React.useState(true);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'24px 28px'}}>
      <TextField label="Worker ID" required placeholder="e.g. MA-40118" hint="As printed on the site badge"
        iconStart={<Icon name="id-card" size={16} />} />
      <SelectField label="Examination type" placeholder="Select an examination"
        options={['Pre-placement','Periodic','Return to work','Exit']} />
      <TextField label="Work email" error="Enter a valid work email" defaultValue="ops@" />
      <TextField label="Clinical notes" multiline rows={2} placeholder="Findings and restrictions" />
      <div className="col" style={{gap:10}}>
        <span className="lbl">Screening included</span>
        <Checkbox label="Audiometry" description="Required above 85 dB(A)" defaultChecked />
        <Checkbox label="Select all workers" indeterminate />
        <Checkbox label="Chest radiography" disabled />
      </div>
      <div className="col" style={{gap:12}}>
        <span className="lbl">Fitness outcome</span>
        <Radio name="o" value={outcome} onChange={setOutcome} options={[
          {value:'fit',label:'Fit for duty'},
          {value:'restricted',label:'Fit with restrictions',description:'Record the restriction and review date'},
          {value:'unfit',label:'Not fit'}]} />
        <Switch label="Expiry alerts" checked={alerts} onChange={setAlerts} />
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
