<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Page, sunken, card, brand-soft and ink grounds" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--weight-semibold) 10px/1.2 var(--font-mono)}
.g{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.k{font:var(--weight-medium) 11px/1 var(--font-mono);color:var(--text-muted)}
.cap{font:var(--type-caption);color:var(--text-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)">
<div style="background:var(--surface-page);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--weight-semibold) 13px/1 var(--font-body)">Page</span><span style="font:var(--weight-medium) 10px/1.3 var(--font-mono);opacity:.75">--surface-page</span></div><div style="background:var(--surface-sunken);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--weight-semibold) 13px/1 var(--font-body)">Sunken</span><span style="font:var(--weight-medium) 10px/1.3 var(--font-mono);opacity:.75">--surface-sunken</span></div><div style="background:var(--surface-brand-soft);color:var(--ma-maroon-700);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--weight-semibold) 13px/1 var(--font-body)">Brand soft</span><span style="font:var(--weight-medium) 10px/1.3 var(--font-mono);opacity:.75">--surface-brand-soft</span></div><div style="background:var(--surface-brand);color:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--weight-semibold) 13px/1 var(--font-body)">Brand</span><span style="font:var(--weight-medium) 10px/1.3 var(--font-mono);opacity:.75">--surface-brand</span></div><div style="background:var(--surface-ink);color:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px;height:88px;display:flex;flex-direction:column;justify-content:space-between"><span style="font:var(--weight-semibold) 13px/1 var(--font-body)">Ink</span><span style="font:var(--weight-medium) 10px/1.3 var(--font-mono);opacity:.75">--surface-ink</span></div>
</div></body></html>
