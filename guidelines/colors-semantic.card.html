<!-- @dsCard group="Colors" viewport="700x150" name="Clinical status colours" subtitle="Fitness and system states: green fit, amber restricted, red unfit, teal informational" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--weight-semibold) 10px/1.2 var(--font-mono)}
.g{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.k{font:var(--weight-medium) 11px/1 var(--font-mono);color:var(--text-muted)}
.cap{font:var(--type-caption);color:var(--text-muted)}</style></head><body><div class="sw">
<div style="background:var(--ma-green-600);color:#fff">green 600</div>
<div style="background:var(--ma-green-50);color:#165C35">green 50</div>
<div style="background:var(--ma-amber-600);color:#fff">amber 600</div>
<div style="background:var(--ma-amber-50);color:#764A05">amber 50</div>
<div style="background:var(--ma-red-600);color:#fff">red 600</div>
<div style="background:var(--ma-red-50);color:#8C1D17">red 50</div>
<div style="background:var(--ma-teal-600);color:#fff">teal 600</div>
<div style="background:var(--ma-teal-50);color:#0A5457">teal 50</div>
</div><div class="row" style="margin-top:10px"><span class="k">fit → success</span><span class="k">restricted → warning</span><span class="k">unfit → danger</span><span class="k">teal is informational only — never a second brand colour</span></div></body></html>
