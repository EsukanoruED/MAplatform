<!-- @dsCard group="Colors" viewport="700x160" name="Text tokens" subtitle="Every text colour in the system, with its token name" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--weight-semibold) 10px/1.2 var(--font-mono)}
.g{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.k{font:var(--weight-medium) 11px/1 var(--font-mono);color:var(--text-muted)}
.cap{font:var(--type-caption);color:var(--text-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div><div style="font:var(--weight-semibold) 14px/1.3 var(--font-body);color:var(--text-primary)">Primary — body and headings</div><div class="k">--text-primary</div></div><div><div style="font:var(--weight-semibold) 14px/1.3 var(--font-body);color:var(--text-secondary)">Secondary — lead paragraphs</div><div class="k">--text-secondary</div></div><div><div style="font:var(--weight-semibold) 14px/1.3 var(--font-body);color:var(--text-muted)">Muted — captions, hints</div><div class="k">--text-muted</div></div><div><div style="font:var(--weight-semibold) 14px/1.3 var(--font-body);color:var(--text-brand)">Brand — eyebrows, links</div><div class="k">--text-brand</div></div><div><div style="font:var(--weight-semibold) 14px/1.3 var(--font-body);color:var(--text-success)">Fit for duty</div><div class="k">--text-success</div></div><div><div style="font:var(--weight-semibold) 14px/1.3 var(--font-body);color:var(--text-danger)">Not fit</div><div class="k">--text-danger</div></div>
</div>
<div style="margin-top:12px;background:var(--surface-ink);border-radius:var(--radius-md);padding:12px 14px" class="ma-ink">
<span style="font:var(--weight-semibold) 14px/1.3 var(--font-body);color:var(--text-primary)">On ink: wrap in <code style="font:var(--type-mono)">.ma-ink</code> and every token flips</span>
<div style="font:var(--type-caption);color:var(--text-secondary);margin-top:3px">Secondary text on ink is white at 72%.</div></div></body></html>
