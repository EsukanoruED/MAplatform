<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--weight-semibold) 10px/1.2 var(--font-mono)}
.g{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.k{font:var(--weight-medium) 11px/1 var(--font-mono);color:var(--text-muted)}
.cap{font:var(--type-caption);color:var(--text-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(2,1fr);gap:14px 24px">
<div><span class="ma-eyebrow">Occupational health</span><div class="k">--type-eyebrow · 12 · 700 · 0.14em · caps</div></div>
<div><span style="font:var(--type-label)">Worker ID</span><div class="k">--type-label · 14 · 600</div></div>
<div><span style="font:var(--type-caption);color:var(--text-muted)">As printed on the site badge</span><div class="k">--type-caption · 12 · 400</div></div>
<div><span style="font:var(--type-mono)">MA-40118 · 14 Mar 2027</span><div class="k">--type-mono · IBM Plex Mono 14</div></div>
</div></body></html>
