<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}

.k{font:var(--weight-medium) 11px/1 var(--font-mono);color:var(--text-muted)}
.cap{font:var(--type-caption);color:var(--text-muted)}</style></head><body><div class="row" style="gap:18px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:var(--surface-brand-soft);border:1px solid var(--ma-maroon-100);border-radius:2px"></div><span class="k">xs 2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:var(--surface-brand-soft);border:1px solid var(--ma-maroon-100);border-radius:4px"></div><span class="k">sm 4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:var(--surface-brand-soft);border:1px solid var(--ma-maroon-100);border-radius:6px"></div><span class="k">md 6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:var(--surface-brand-soft);border:1px solid var(--ma-maroon-100);border-radius:10px"></div><span class="k">lg 10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:var(--surface-brand-soft);border:1px solid var(--ma-maroon-100);border-radius:16px"></div><span class="k">xl 16</span></div>
<div style="width:1px;height:52px;background:var(--border-default)"></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-xs)"></div><span class="k">xs</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)"></div><span class="k">sm</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-md)"></div><span class="k">md</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:56px;height:44px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-lg)"></div><span class="k">lg</span></div>
</div></body></html>
