<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="140ms controls, 200ms surfaces, one decelerating ease — no bounce anywhere" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}
.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font:var(--weight-semibold) 10px/1.2 var(--font-mono)}
.g{display:grid;gap:10px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.k{font:var(--weight-medium) 11px/1 var(--font-mono);color:var(--text-muted)}
.cap{font:var(--type-caption);color:var(--text-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(3,1fr)">
<div style="border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px"><div style="font:var(--weight-bold) 20px/1 var(--font-body);color:var(--text-brand)">140ms</div><div class="k" style="margin:5px 0 6px">--duration-fast</div><div class="cap">Control colour, border, focus ring</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px"><div style="font:var(--weight-bold) 20px/1 var(--font-body);color:var(--text-brand)">200ms</div><div class="k" style="margin:5px 0 6px">--duration-base</div><div class="cap">Card lift, tab underline, toggles</div></div><div style="border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:12px"><div style="font:var(--weight-bold) 20px/1 var(--font-body);color:var(--text-brand)">280ms</div><div class="k" style="margin:5px 0 6px">--duration-slow</div><div class="cap">Modal scrim, meter fill</div></div>
</div><div class="cap" style="margin-top:10px"><code style="font:var(--type-mono)">--ease-standard: cubic-bezier(.2,.8,.25,1)</code> — used for everything. Hover lifts 2px, press drops 1px; nothing scales.</div></body></html>
