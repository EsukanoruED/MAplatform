<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Medical Alliance — occupational health portal kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.470.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body>
<div id="root"></div>
<script type="text/babel" src="PortalChrome.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="WorkerScreen.jsx"></script>
<script type="text/babel" src="CertificatesScreen.jsx"></script>
<script type="text/babel">
const { Card, Icon } = window.MedicalAllianceDesignSystem_32f8e4;

function Placeholder({ title }) {
  return (
    <React.Fragment>
      <PortalTopBar title={title} />
      <PortalBody>
        <Card tone="sunken" padding="var(--space-12)" style={{ maxWidth: 560, alignItems: 'flex-start' }}>
          <span style={{ color: 'var(--text-muted)' }}><Icon name="construction" size={26} /></span>
          <h2 style={{ font: 'var(--type-heading-4)', marginTop: 'var(--space-3)' }}>{title}</h2>
          <p style={{ font: 'var(--type-body-sm)', color: 'var(--text-secondary)' }}>
            Left intentionally blank — no source design was supplied for this view. Build it against the
            real product screens rather than inventing one here.
          </p>
        </Card>
      </PortalBody>
    </React.Fragment>
  );
}

function App() {
  const [signedIn, setSignedIn] = React.useState(false);
  const [route, setRoute] = React.useState('dashboard');
  const [worker, setWorker] = React.useState(null);

  if (!signedIn) return <LoginScreen onSignIn={() => setSignedIn(true)} />;

  const openWorker = (w) => { setWorker(w); setRoute('worker'); };
  let view;
  if (route === 'dashboard') view = <DashboardScreen onOpenWorker={openWorker} />;
  else if (route === 'worker') view = <WorkerScreen worker={worker} onBack={() => setRoute('dashboard')} />;
  else if (route === 'workers') view = <DashboardScreen onOpenWorker={openWorker} />;
  else if (route === 'certificates') view = <CertificatesScreen />;
  else view = <Placeholder title={{ clinics: 'Site clinics', stock: 'Stock and equipment', settings: 'Settings' }[route] || 'Not built'} />;

  return (
    <PortalShell route={route === 'worker' ? 'workers' : route} onNavigate={setRoute}>
      {view}
    </PortalShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
